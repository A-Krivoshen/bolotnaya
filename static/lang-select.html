<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Bolotnaya Online — Болотная: Якиманка</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Камеры, история и фото Болотной площади. Open-source проект жителя Якиманки.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://bolotnaya.online/ru/">
  <link rel="alternate" hreflang="ru-RU" href="https://bolotnaya.online/ru/">
  <link rel="alternate" hreflang="en-US" href="https://bolotnaya.online/en/">
  <link rel="alternate" hreflang="x-default" href="https://bolotnaya.online/ru/">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="120x120" href="/favicon-120x120.png">
  <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script>
  (function () {
    function dest() {
      try {
        var pref = localStorage.getItem('pref-lang');
        if (pref === 'en' || pref === 'ru') return '/' + pref + '/';
      } catch (e) {}
      var raw = '';
      if (navigator.languages && navigator.languages.length) raw = navigator.languages[0];
      else raw = navigator.language || navigator.userLanguage || '';
      return String(raw).toLowerCase().indexOf('ru') === 0 ? '/ru/' : '/en/';
    }
    location.replace(dest());
  })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=/ru/">
  </noscript>
</head>
<body>
  <h1>Bolotnaya Online</h1>
  <p>Болотная площадь и Якиманка: история, фото и камеры проекта.</p>

</body>
</html>
