baseURL = "https://bolotnaya.online/"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = true
title = "Bolotnaya Online — Болотная: Якиманка"
theme = "PaperMod"
enableRobotsTXT = false # static/robots.txt is the source of truth
enableGitInfo = false
canonifyURLs = false
relativeURLs = false
disableHugoGeneratorInject = false
summaryLength = 40
timeout = "60s"

[pagination]
  pagerSize = 12
  disableAliases = true

[imaging]
  quality = 85
  resampleFilter = "Lanczos"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]
  tag = "tags"
  category = "categories"

[languages]
  [languages.ru]
    label = "Русский"
    locale = "ru-RU"
    contentDir = "content/ru"
    weight = 1
    title = "Bolotnaya Online — Болотная: Якиманка"
    [languages.ru.params]
      description = "Камеры Болотной сейчас offline (леса с июня 2026). История, фото и хроника ремонта фасада — open-source проект жителя Якиманки."
      keywords = ["Болотная площадь", "Якиманка", "камеры offline", "леса 2026", "Москва", "история Москвы"]
      homeInfoTitle = "Якиманка: камеры и история"
      homeInfoDescription = "Пока эфира нет — история, фото и ремонт лесов 2026 у Болотной"

    [languages.ru.menu]
      [[languages.ru.menu.main]]
        name   = "Камеры"
        url    = "/ru/cameras/"
        weight = 1
      [[languages.ru.menu.main]]
        name   = "Леса 2026"
        url    = "/ru/remont-lesa-2026/"
        weight = 2
      [[languages.ru.menu.main]]
        name   = "История"
        url    = "/ru/history/"
        weight = 3
      [[languages.ru.menu.main]]
        name   = "Фото"
        url    = "/ru/galleries/"
        weight = 4
      [[languages.ru.menu.main]]
        name   = "Блог"
        url    = "/ru/posts/"
        weight = 5

  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 2
    title = "Bolotnaya Online — Yakimanka cameras & history"
    [languages.en.params]
      description = "Bolotnaya Square cameras are offline during facade scaffolding (since June 2026). History, photos and a repair chronicle. Open-source local project."
      keywords = ["Bolotnaya Square", "Yakimanka", "Moscow", "scaffolding 2026", "Moscow history"]
      homeInfoTitle = "Yakimanka: cameras and history"
      homeInfoDescription = "Offline cameras for now — history, photos and the 2026 scaffolding chronicle"

    [languages.en.menu]
      [[languages.en.menu.main]]
        name   = "Cameras"
        url    = "/en/cameras/"
        weight = 1
      [[languages.en.menu.main]]
        name   = "Repair 2026"
        url    = "/en/remont-lesa-2026/"
        weight = 2
      [[languages.en.menu.main]]
        name   = "History"
        url    = "/en/history/"
        weight = 3
      [[languages.en.menu.main]]
        name   = "Photos"
        url    = "/en/galleries/"
        weight = 4
      [[languages.en.menu.main]]
        name   = "Blog"
        url    = "/en/posts/"
        weight = 5

[params]
  author = "Bolotnaya.online"
  description = "Болотная площадь и Якиманка: история, фото и камеры проекта (сейчас offline из-за лесов). Open-source bolotnaya.online."
  keywords = ["Болотная площадь", "Якиманка", "леса 2026", "Bolotnaya", "Yakimanka", "Moscow"]
  images = ["/images/galleries/lesa-2026/2026-06-13-camera-still.jpg"]
  mainSections = ["cameras", "posts", "history", "galleries"]
  DateFormat = "02.01.2006"
  defaultTheme = "auto" # auto = light 07:00–21:00, dark nights; local clock, not OS
  disableThemeToggle = false
  camerasOffline = true
  camerasOfflineStill = "/images/galleries/lesa-2026/2026-06-13-camera-still.jpg"
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowToc = false
  ShowPostNavLinks = false
  ShowFullTextinRSS = true
  ShowCodeCopyButtons = false
  hideSummary = false
  hideMeta = false
  # Performance: drop unused AOS (not referenced in templates)
  customCSS = [
    "/css/custom.css"
  ]
  customJS = [
    "/js/custom.js"
  ]
  env = "production"

[params.support]
  yoomoney_url = "https://yoomoney.ru/fundraise/YeyI3ANEDyA.230505"

[params.partner]
  name = "Beget"
  url = "https://beget.com/?id=754742"
  banner_img = "https://cp.beget.com/promo_data/static/970x90-12.png"
  banner_alt = "Beget — партнёр трансляции"

[params.contact]
  email = "info@bolotnaya.online"

[params.label]
  text = "Bolotnaya Online"

# Markup / goldmark security for safer HTML
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
