baseURL = "https://bolotnaya.online/"
defaultContentLanguage = "ru"
defaultContentLanguageInSubdir = true
title = "Bolotnaya Online — Болотная: Якиманка"
theme = "PaperMod"
enableRobotsTXT = false # static/robots.txt is the source of truth
enableGitInfo = false
canonifyURLs = false
relativeURLs = false
disableHugoGeneratorInject = false
summaryLength = 40
timeout = "60s"

[pagination]
  pagerSize = 12
  disableAliases = true

[imaging]
  quality = 85
  resampleFilter = "Lanczos"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]
  tag = "tags"
  category = "categories"

[languages]
  [languages.ru]
    label = "Русский"
    locale = "ru-RU"
    contentDir = "content/ru"
    weight = 1
    title = "Bolotnaya Online — Болотная: Якиманка"
    [languages.ru.params]
      description = "Вебкамера Болотной площади онлайн с ул. Серафимовича. В эфире с 8 октября 2026: площадь, канал и мостик. История и фото Якиманки."
      keywords = ["Болотная площадь", "вебкамера Болотной площади", "онлайн камера Болотная", "Якиманка", "камера Болотная", "Серафимовича", "Москва"]
      homeInfoTitle = "Якиманка: камера и история"
      homeInfoDescription = "Эфир с ул. Серафимовича: площадь, канал и новый мостик. Рядом история и фото."

    [languages.ru.menu]
      [[languages.ru.menu.main]]
        name   = "Камера"
        url    = "/ru/cameras/"
        weight = 1
      [[languages.ru.menu.main]]
        name   = "История"
        url    = "/ru/history/"
        weight = 3
      [[languages.ru.menu.main]]
        name   = "Фото"
        url    = "/ru/galleries/"
        weight = 4
      [[languages.ru.menu.main]]
        name   = "Блог"
        url    = "/ru/posts/"
        weight = 5

  [languages.en]
    label = "English"
    locale = "en-US"
    contentDir = "content/en"
    weight = 2
    title = "Bolotnaya Online — Yakimanka camera & history"
    [languages.en.params]
      description = "Live webcam of Bolotnaya Square from Ulitsa Serafimovicha. On air since 8 October 2026: the square, the canal and the footbridge. History and photos of Yakimanka."
      keywords = ["Bolotnaya Square", "Bolotnaya Square webcam", "live camera Bolotnaya", "Yakimanka", "Moscow", "Serafimovicha"]
      homeInfoTitle = "Yakimanka: camera and history"
      homeInfoDescription = "Live from Ulitsa Serafimovicha: the square, the canal and the new footbridge, plus history and photos."

    [languages.en.menu]
      [[languages.en.menu.main]]
        name   = "Camera"
        url    = "/en/cameras/"
        weight = 1
      [[languages.en.menu.main]]
        name   = "History"
        url    = "/en/history/"
        weight = 3
      [[languages.en.menu.main]]
        name   = "Photos"
        url    = "/en/galleries/"
        weight = 4
      [[languages.en.menu.main]]
        name   = "Blog"
        url    = "/en/posts/"
        weight = 5

[params]
  author = "Bolotnaya.online"
  description = "Болотная площадь и Якиманка: одна камера в эфире, история и фото. Open-source bolotnaya.online."
  keywords = ["Болотная площадь", "Якиманка", "леса 2026", "Bolotnaya", "Yakimanka", "Moscow"]
  images = ["/images/cameras/serafimovicha-neopunk.jpg"]
  mainSections = ["cameras", "posts", "history", "galleries"]
  DateFormat = "02.01.2006"
  defaultTheme = "auto" # auto = light 07:00–21:00, dark nights; local clock, not OS
  disableThemeToggle = false
  camerasOffline = false
  camerasOfflineStill = "/images/galleries/lesa-2026/camera-still-mesh.jpg"
  ShowReadingTime = false
  ShowBreadCrumbs = true
  ShowToc = false
  ShowPostNavLinks = false
  ShowFullTextinRSS = true
  ShowCodeCopyButtons = false
  hideSummary = false
  hideMeta = false
  # Performance: drop unused AOS (not referenced in templates)
  customCSS = [
    "/css/custom.css"
  ]
  customJS = [
    "/js/custom.js"
  ]
  env = "production"

[params.support]
  yoomoney_url = "https://yoomoney.ru/fundraise/YeyI3ANEDyA.230505"

[params.partner]
  name = "Beget"
  url = "https://beget.com/?id=754742"
  banner_img = "https://cp.beget.com/promo_data/static/970x90-12.png"
  banner_alt = "Beget — партнёр трансляции"

[params.contact]
  email = "info@bolotnaya.online"

[params.label]
  text = "Bolotnaya Online"

# Markup / goldmark security for safer HTML
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
