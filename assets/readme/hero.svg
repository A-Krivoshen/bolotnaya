<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Bolotnaya Online</title>
  <desc id="desc">A bilingual Hugo site for Yakimanka live cameras, Bolotnaya Square history, photo galleries, and GitHub Actions deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071012"/>
      <stop offset="0.58" stop-color="#10201f"/>
      <stop offset="1" stop-color="#20352f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6fd2c2" stop-opacity="0.28"/>
      <stop offset="0.54" stop-color="#9ecac0" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f1bf75" stop-opacity="0.34"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="34" fill="url(#bg)"/>
  <path d="M-32 290 C150 214 224 344 380 263 C526 186 646 70 824 138 C1003 206 1057 108 1234 48" fill="none" stroke="url(#river)" stroke-width="92" stroke-linecap="round"/>
  <path d="M-22 289 C151 226 241 326 390 255 C536 185 650 100 813 153 C992 211 1054 126 1224 75" fill="none" stroke="#d8f5ef" stroke-opacity="0.22" stroke-width="2"/>

  <g transform="translate(64 56)">
    <text x="0" y="0" fill="#8ed8ca" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700" letter-spacing="2">YAKIMANKA / MOSCOW / HUGO</text>
    <text x="0" y="76" fill="#f7f3e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Bolotnaya</text>
    <text x="0" y="145" fill="#f7f3e8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Online</text>
    <text x="2" y="197" fill="#c7d7d1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="500">Live cameras, local history and photo archive</text>
    <text x="2" y="233" fill="#9fb8b0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24">RU/EN open-source district site for Bolotnaya Square</text>
  </g>

  <g transform="translate(64 314)">
    <rect x="0" y="-28" width="142" height="42" rx="21" fill="#f1bf75" fill-opacity="0.16" stroke="#f1bf75" stroke-opacity="0.45"/>
    <text x="22" y="0" fill="#ffe0a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">HLS</text>
    <rect x="158" y="-28" width="152" height="42" rx="21" fill="#6fd2c2" fill-opacity="0.13" stroke="#6fd2c2" stroke-opacity="0.4"/>
    <text x="181" y="0" fill="#bff5ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">RU / EN</text>
    <rect x="326" y="-28" width="214" height="42" rx="21" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
    <text x="350" y="0" fill="#e8f2ef" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">GitHub Actions</text>
  </g>

  <g transform="translate(720 54)" filter="url(#softShadow)">
    <rect width="414" height="272" rx="28" fill="#f7f3e8"/>
    <rect x="22" y="22" width="370" height="156" rx="20" fill="#12201f"/>
    <path d="M49 135 C116 91 175 147 245 102 C295 70 338 79 371 53" fill="none" stroke="#6fd2c2" stroke-width="13" stroke-linecap="round"/>
    <circle cx="97" cy="92" r="28" fill="#f1bf75" fill-opacity="0.92"/>
    <circle cx="97" cy="92" r="12" fill="#12201f"/>
    <rect x="48" y="202" width="112" height="32" rx="16" fill="#112321"/>
    <text x="66" y="224" fill="#bff5ea" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">CAMERAS</text>
    <rect x="174" y="202" width="94" height="32" rx="16" fill="#ebefe6"/>
    <text x="192" y="224" fill="#20352f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">STORY</text>
    <rect x="282" y="202" width="84" height="32" rx="16" fill="#ebefe6"/>
    <text x="303" y="224" fill="#20352f" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" font-weight="700">PHOTO</text>
  </g>

  <g transform="translate(796 68)">
    <text x="0" y="0" fill="#f7f3e8" fill-opacity="0.28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">/ru/cameras/</text>
  </g>
</svg>
