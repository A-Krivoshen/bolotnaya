# Canonical host + language home for bolotnaya.online
# Include from the www and apex server blocks on the VPS.

# www → apex (put this in the www server { } as the only action, or as a separate server)
# server {
#     listen 443 ssl http2;
#     server_name www.bolotnaya.online;
#     return 301 https://bolotnaya.online$request_uri;
# }

# Apex "/" is a language gate (browser locale → /ru/ or /en/).
# deploy-bolotnaya.sh copies static/lang-select.html over public/index.html.
location = / {
    more_set_headers "Cache-Control : no-store";
    try_files /index.html =404;
}

# Front-matter aliases that Hugo builds under /ru/ or /en/ only.
# Mirror of the live vhost; crawlers hitting /news/ (no such section) go to history.
location = /lesa-2026 { return 301 /ru/remont-lesa-2026/; }
location = /lesa-2026/ { return 301 /ru/remont-lesa-2026/; }
location = /repair-2026 { return 301 /en/remont-lesa-2026/; }
location = /repair-2026/ { return 301 /en/remont-lesa-2026/; }
location = /scaffolding-2026 { return 301 /en/remont-lesa-2026/; }
location = /scaffolding-2026/ { return 301 /en/remont-lesa-2026/; }
location = /ru/galleries/raion-2022-2023 { return 301 /ru/galleries/; }
location = /ru/galleries/raion-2022-2023/ { return 301 /ru/galleries/; }
location = /en/galleries/raion-2022-2023 { return 301 /en/galleries/; }
location = /en/galleries/raion-2022-2023/ { return 301 /en/galleries/; }
location = /news { return 301 https://bolotnaya.online/ru/history/; }
location = /news/ { return 301 https://bolotnaya.online/ru/history/; }
location = /en/news { return 301 https://bolotnaya.online/en/history/; }
location = /en/news/ { return 301 https://bolotnaya.online/en/history/; }
location = /ru/news { return 301 https://bolotnaya.online/ru/history/; }
location = /ru/news/ { return 301 https://bolotnaya.online/ru/history/; }
