# Canonical host + language home for bolotnaya.online
# Include from the www and apex server blocks on the VPS.

# www → apex (put this in the www server { } as the only action, or as a separate server)
# server {
#     listen 443 ssl http2;
#     server_name www.bolotnaya.online;
#     return 301 https://bolotnaya.online$request_uri;
# }

# Apex "/" is a Hugo alias (200 + meta-refresh). Google treats that as a duplicate
# of /ru/. Replace the alias document with a real redirect:
location = / {
    return 301 https://bolotnaya.online/ru/;
}
